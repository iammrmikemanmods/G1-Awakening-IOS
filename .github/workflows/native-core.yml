name: Build native game test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/**
      - scripts/**
      - .github/workflows/native-core.yml
  pull_request:
    branches: [main]
    paths:
      - native/**
      - scripts/**
      - .github/workflows/native-core.yml

permissions:
  contents: read

concurrency:
  group: g1-native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ zlib1g-dev
      - name: Configure
        run: cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile native core and tests
        run: cmake --build build/native --parallel 2
      - name: Test recovered native behavior
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

  iphoneos-arm64:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
      - name: Configure native iPhoneOS ARM64 library
        run: >-
          cmake -S native -B build/iphoneos -G Ninja
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=17.5
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DG1_BUILD_APP=ON
          -DG1_SOURCE_COMMIT=${{ github.sha }}
      - name: Compile native ARM64 sources
        run: cmake --build build/iphoneos --parallel 2
      - name: Compile exact runtime M3G shader for iPhoneOS
        run: |
          mkdir -p artifacts
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent metalToolchain
            xcrun --sdk iphoneos metal --version
          fi
          python3 analysis_tools/m3g/extract_metal_shader.py --header native/platform/apple/MetalM3GShader.hpp --output artifacts/native-m3g-shader.metal
          xcrun --sdk iphoneos metal -std=ios-metal2.4 -c artifacts/native-m3g-shader.metal -o artifacts/native-m3g-shader.air
      - name: Verify native archives and app target
        run: |
          mkdir -p artifacts
          python3 scripts/verify-native-archive.py build/iphoneos/libg1_resources.a > artifacts/native-core-objects.json
          python3 scripts/verify-native-archive.py build/iphoneos/libg1_png.a > artifacts/native-png-objects.json
          python3 scripts/verify-native-archive.py build/iphoneos/libg1_vorbis.a > artifacts/native-vorbis-objects.json
          python3 scripts/verify-native-archive.py build/iphoneos/libg1_metal.a > artifacts/native-metal-objects.json
          python3 scripts/verify-native-app.py build/iphoneos/G1AwakeningNative.app --out artifacts/native-app-validation.json
      - name: Compile macOS native tests and offscreen Metal probes
        run: |
          cmake -S native -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/macos --parallel 2
      - name: Check all portable native behavior on Apple ARM64
        run: ctest --test-dir build/macos -E '^(metal_offscreen_pixels|m3g_metal_offscreen_pixels)$' --output-on-failure --no-tests=error
      - name: Check actual offscreen Metal pixels when a device is available
        shell: bash
        run: |
          set +e
          build/macos/g1_metal_probe artifacts/metal-corners.png > artifacts/metal-report.json
          g1_probe_status=$?
          set -e
          cat artifacts/metal-report.json
          if [ "$g1_probe_status" -eq 77 ]; then
            echo 'No Metal device on runner; GPU pixel test was skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$g1_probe_status" -ne 0 ]; then
            exit "$g1_probe_status"
          fi
      - name: Check native M3G mesh and Sprite3D Metal pixels
        shell: bash
        run: |
          set +e
          build/macos/g1_m3g_metal_probe artifacts/m3g-metal-corners.png > artifacts/m3g-metal-report.json
          g1_m3g_probe_status=$?
          set -e
          cat artifacts/m3g-metal-report.json
          if [ "$g1_m3g_probe_status" -eq 77 ]; then
            echo 'No Metal device on runner; M3G GPU pixel test was skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$g1_m3g_probe_status" -ne 0 ]; then
            exit "$g1_m3g_probe_status"
          fi
      - name: Prepare unsigned native code artifact
        run: |
          cp -R build/iphoneos/G1AwakeningNative.app artifacts/
          mkdir -p artifacts/G1AwakeningNative.app/Licenses
          cp LICENSE artifacts/G1AwakeningNative.app/Licenses/Native-Port-MPL-2.0.txt
          cp native/third_party/lodepng/LICENSE artifacts/G1AwakeningNative.app/Licenses/LodePNG-Zlib.txt
          cp native/third_party/stb/LICENSE artifacts/G1AwakeningNative.app/Licenses/STB-MIT-Public-Domain.txt
          cp docs/README_MEMORY_ZIP_POLICY.md artifacts/README_MEMORY_ZIP_POLICY.md
      - name: Preserve native game code and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: G1-native-game-unsigned-code
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - name: Record validation boundary
        run: |
          echo '## Native campaign integration test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Builds new ARM64 app code for iPhone XR on iOS 17.5. Original assets are packaged locally. A successful build does not verify iPhone XR execution, full gameplay, saves, sustained 60 FPS, or campaign completion.' >> "$GITHUB_STEP_SUMMARY"
