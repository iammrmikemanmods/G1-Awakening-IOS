name: Sign Build013 G1 ARM64 code for Filza AppSync

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/appsync-sign-013.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-validated-native-code:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CODE_ARTIFACT_ID: '12721851404'
      CODE_ARCHIVE_SHA256: 007292444724bfe5bc058cceb1c91c7c855f3a90fef04e4dd87ed79ac6be3b1f
      COMPILED_COMMIT: 98f0312f4761a13b2a9b96ed4685382266023324
      UNSIGNED_EXE_SHA256: 3017f742e9df4dd939f80dcf6985e282bce02dbda0d96e035c5cd16d1806ef90
    steps:
      - name: Check out repository verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and authenticate exact passed Build013 ARM64 code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input artifacts/appsync
          curl -fLsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CODE_ARTIFACT_ID}/zip" \
            -o input/code013.zip
          echo "${CODE_ARCHIVE_SHA256}  input/code013.zip" | shasum -a 256 --check
          unzip -q input/code013.zip -d input/code
          cp -R input/code/G1AwakeningNative.app artifacts/appsync/G1AwakeningNative.app
          cp input/code/README_MEMORY_ZIP_POLICY.md artifacts/appsync/README_MEMORY_ZIP_POLICY.md
          python3 - <<'PY'
          import hashlib,os,plistlib
          from pathlib import Path
          app=Path('artifacts/appsync/G1AwakeningNative.app')
          exe=app/'G1AwakeningNative'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==os.environ['UNSIGNED_EXE_SHA256']
          assert info['G1SourceCommit']==os.environ['COMPILED_COMMIT']
          assert info['CFBundleVersion']=='13' and info['CFBundleShortVersionString']=='0.13.0'
          assert info['CFBundleIdentifier']=='org.g1awakening.native.test'
          assert info['MinimumOSVersion']=='17.5'
          PY
      - name: Embed AppSync entitlement signature in standalone Mach-O
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          Path('input/entitlements.plist').write_bytes(plistlib.dumps(
              {'application-identifier':'org.g1awakening.native.test','get-task-allow':True},
              fmt=plistlib.FMT_XML))
          PY
          mkdir -p input/standalone
          cp artifacts/appsync/G1AwakeningNative.app/G1AwakeningNative input/standalone/G1AwakeningNative
          codesign --force --sign - --identifier org.g1awakening.native.test \
            --timestamp=none --generate-entitlement-der \
            --entitlements input/entitlements.plist input/standalone/G1AwakeningNative
          codesign --verify --strict --verbose=2 input/standalone/G1AwakeningNative
          codesign --display --entitlements :- input/standalone/G1AwakeningNative > artifacts/appsync/extracted-entitlements.plist
          cp input/standalone/G1AwakeningNative artifacts/appsync/G1AwakeningNative.app/G1AwakeningNative
          # Only the standalone executable is signed. Original media and code
          # must later be packaged locally; no stale bundle resource seal.
          test ! -e artifacts/appsync/G1AwakeningNative.app/_CodeSignature/CodeResources
      - name: Verify signed ARM64 identity and embedded entitlements
        run: |
          set -euo pipefail
          python3 scripts/verify-native-app.py artifacts/appsync/G1AwakeningNative.app \
            --out artifacts/appsync/native-app-validation.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,plistlib
          folder=Path('artifacts/appsync')
          ent=plistlib.loads((folder/'extracted-entitlements.plist').read_bytes())
          assert ent=={'application-identifier':'org.g1awakening.native.test','get-task-allow':True}
          validation=json.loads((folder/'native-app-validation.json').read_text())
          app=folder/'G1AwakeningNative.app'
          exe=app/'G1AwakeningNative'
          assert validation['source_commit']==os.environ['COMPILED_COMMIT']
          assert validation['architecture']=='arm64' and validation['minimum_os']=='17.5'
          assert validation['bundle_identifier']==ent['application-identifier']
          assert validation['executable_sha256']==hashlib.sha256(exe.read_bytes()).hexdigest()
          record={'source_compiled_commit':os.environ['COMPILED_COMMIT'],
                  'source_archive_sha256':os.environ['CODE_ARCHIVE_SHA256'],
                  'unsigned_executable_sha256':os.environ['UNSIGNED_EXE_SHA256'],
                  'signed_executable_sha256':validation['executable_sha256'],
                  'signed_executable_bytes':exe.stat().st_size,
                  'application_identifier':ent['application-identifier'],
                  'entitlements':ent,'standalone_macho_codesign_verified':True,
                  'bundle_resources_sealed':False,'requires_appsync_unified':True,
                  'apple_developer_provisioned':False,'physical_iphone_installed':False}
          (folder/'appsync-signature-validation.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Preserve signed Build013 code, never original copyrighted game data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: G1-build013-appsync-signed-code
          path: artifacts/appsync/
          retention-days: 14
          if-no-files-found: error
