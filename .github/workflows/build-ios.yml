name: Retire compatibility-host build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ios.yml

permissions:
  contents: read

# Use the former build's group to cancel its in-progress macOS job.
concurrency:
  group: g1-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-native-port-requirement:
    runs-on: ubuntu-latest
    steps:
      - name: Record the requested native-port scope
        run: |
          echo '## Native ARM64 port required' >> "$GITHUB_STEP_SUMMARY"
          echo 'The user explicitly rejected the interpreter/compatibility-host approach. That build is retired. No compatibility IPA is a project deliverable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Continue with native source reconstruction and modern iOS rendering, input, audio and saves. Preserve the earlier experiment only as historical research.' >> "$GITHUB_STEP_SUMMARY"
