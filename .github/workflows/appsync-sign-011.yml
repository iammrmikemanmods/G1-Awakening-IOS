name: Build011 original G1 Filza AppSync signature

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/appsync-sign-011.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-native-build011:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CODE_ARCHIVE_SHA256: 5df47e932ba9c07d41ff41cc19088b263ae2baa1e571d34fa61ccac233f0a38d
      COMPILED_COMMIT: 5db26ba75ae5175c9653aadadef83a78de75dae6
      UNSIGNED_EXE_SHA256: 3a627edcb69c641b481c6c1aadbc2d0b6de2343c955978c488f539e1b9b3addc
    steps:
      - name: Check out native validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch and authenticate the exact passed Build011 native code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input artifacts/appsync
          curl -fLsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12709905179/zip" -o input/build011-code.zip
          echo "${CODE_ARCHIVE_SHA256}  input/build011-code.zip" | shasum -a 256 --check
          unzip -q input/build011-code.zip -d input/source
          cp -R input/source/G1AwakeningNative.app artifacts/appsync/G1AwakeningNative.app
          cp input/source/README_MEMORY_ZIP_POLICY.md artifacts/appsync/README_MEMORY_ZIP_POLICY.md
          python3 - <<'PY'
          import hashlib,plistlib,os
          from pathlib import Path
          app=Path('artifacts/appsync/G1AwakeningNative.app')
          exe=app/'G1AwakeningNative'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==os.environ['UNSIGNED_EXE_SHA256']
          assert info['G1SourceCommit']==os.environ['COMPILED_COMMIT']
          assert info['CFBundleVersion']=='11' and info['CFBundleShortVersionString']=='0.11.0'
          assert info['CFBundleIdentifier']=='org.g1awakening.native.test'
          assert info['MinimumOSVersion']=='17.5'
          PY
      - name: Add valid AppSync entitlement signature to original ARM64 executable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          Path('input/entitlements.plist').write_bytes(plistlib.dumps(
             {'application-identifier':'org.g1awakening.native.test','get-task-allow':True},
             fmt=plistlib.FMT_XML))
          PY
          # Do NOT code sign an incomplete .app: original game assets and intro
          # only enter locally. Signing outside avoids stale resource seals.
          mkdir -p input/standalone
          cp artifacts/appsync/G1AwakeningNative.app/G1AwakeningNative input/standalone/G1AwakeningNative
          codesign --force --sign - --identifier org.g1awakening.native.test \
            --timestamp=none --generate-entitlement-der \
            --entitlements input/entitlements.plist input/standalone/G1AwakeningNative
          codesign --verify --strict --verbose=2 input/standalone/G1AwakeningNative
          codesign --display --entitlements :- input/standalone/G1AwakeningNative > artifacts/appsync/extracted-entitlements.plist
          cp input/standalone/G1AwakeningNative artifacts/appsync/G1AwakeningNative.app/G1AwakeningNative
          test ! -e artifacts/appsync/G1AwakeningNative.app/_CodeSignature/CodeResources
      - name: Validate identity and embedded entitlements
        run: |
          set -euo pipefail
          python3 scripts/verify-native-app.py artifacts/appsync/G1AwakeningNative.app --out artifacts/appsync/native-app-validation.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,plistlib,os
          root=Path('artifacts/appsync')
          ent=plistlib.loads((root/'extracted-entitlements.plist').read_bytes())
          assert ent=={'application-identifier':'org.g1awakening.native.test','get-task-allow':True}
          app=json.loads((root/'native-app-validation.json').read_text())
          assert app['source_commit']==os.environ['COMPILED_COMMIT']
          assert app['architecture']=='arm64' and app['minimum_os']=='17.5'
          assert app['bundle_identifier']==ent['application-identifier']
          exe=root/'G1AwakeningNative.app/G1AwakeningNative'
          assert app['executable_sha256']==hashlib.sha256(exe.read_bytes()).hexdigest()
          signed={'source_compiled_commit':os.environ['COMPILED_COMMIT'],
                  'unsigned_executable_sha256':os.environ['UNSIGNED_EXE_SHA256'],
                  'signed_executable_sha256':app['executable_sha256'],
                  'signed_executable_bytes':exe.stat().st_size,
                  'application_identifier':ent['application-identifier'],
                  'entitlements':ent,'standalone_macho_codesign_verified':True,
                  'bundle_resources_sealed':False,'requires_appsync_unified':True,
                  'physical_iphone_installed':False}
          (root/'appsync-signature-validation.json').write_text(json.dumps(signed,indent=2)+'\n')
          PY
      - name: Preserve only signed code, never original copyrighted game data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: G1-build011-appsync-signed-code
          path: artifacts/appsync/
          retention-days: 14
          if-no-files-found: error
